<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Memory Video</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f7f7f7;
    }
    h1 {
      margin-bottom: 20px;
    }
    .video-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

  <h1>Memory Video</h1>

  <div class="video-container">
    <iframe 
      src="https://cinema8.com/embed/ADxEkj2X" 
      allow="autoplay; fullscreen" 
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
