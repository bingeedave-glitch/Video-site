<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banging Films</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    header {
      padding: 20px;
      background: #000;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #searchBar {
      width: 60%;
      padding: 10px;
      border-radius: 5px;
      border: none;
    }
    #categorySelect {
      padding: 10px;
      border-radius: 5px;
      border: none;
    }
    .film-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .film-card {
      background: #222;
      padding: 15px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .film-card:hover {
      background: #333;
    }
    .film-card img {
      width: 100%;
      border-radius: 5px;
    }
    #playerModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
    }
    #playerBox {
      width: 90%;
      max-width: 900px;
      background: #000;
      padding: 20px;
      border-radius: 10px;
    }
    #closeBtn {
      background: red;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      color: #fff;
      float: right;
    }
  </style>
</head>
<body>

<header>
  <input id="searchBar" placeholder="Search films..." />
  <select id="categorySelect"></select>
</header>

<div class="film-grid" id="filmGrid"></div>

<div id="playerModal">
  <div id="playerBox">
    <button id="closeBtn">Close</button>
    <div id="playerContainer"></div>
    <div id="filmInfo"></div>
  </div>
</div>

<script>
const OMDB_KEY = "3d035420";

// Add your films here
const films = [
  { imdb: "tt0241527", screenpal: "cTXoqunFSCk" },
  { imdb: "tt2990140", screenpal: "cTXDotnFWwK" },
  { imdb: "tt0099785", screenpal: "cTXDX3nFWqh" }
];

const filmDataCache = {};

// Preload all IMDb data once
async function preloadFilms() {
  await Promise.all(films.map(async film => {
    if (!filmDataCache[film.imdb]) {
      try {
        const data = await fetch(`https://www.omdbapi.com/?i=${film.imdb}&apikey=${OMDB_KEY}`)
          .then(r => r.json());
        if (data && data.Response !== "False") {
          filmDataCache[film.imdb] = data;
        } else {
          console.warn("IMDb data not found for", film.imdb);
        }
      } catch (e) {
        console.error("Error fetching IMDb data for", film.imdb, e);
      }
    }
  }));
}

// Build category dropdown
function buildCategories() {
  const select = document.getElementById("categorySelect");
  const genreSet = new Set(["all"]);
  Object.values(filmDataCache).forEach(data => {
    const genres = data.Genre ? data.Genre.toLowerCase().split(", ") : [];
    genres.forEach(g => genreSet.add(g));
  });
  select.innerHTML = "";
  genreSet.forEach(g => {
    const opt = document.createElement("option");
    opt.value = g;
    opt.textContent = g.charAt(0).toUpperCase() + g.slice(1);
    select.appendChild(opt);
  });
}

// Render films (only uses preloaded data)
function renderFilms() {
  const grid = document.getElementById("filmGrid");
  const search = document.getElementById("searchBar").value.toLowerCase();
  const category = document.getElementById("categorySelect").value;
  grid.innerHTML = "";

  films.forEach(film => {
    const data = filmDataCache[film.imdb];
    if (!data) return;

    const genres = data.Genre ? data.Genre.toLowerCase().split(", ") : ["uncategorized"];
    if (category !== "all" && !genres.includes(category)) return;
    if (search && !data.Title.toLowerCase().includes(search)) return;

    const card = document.createElement("div");
    card.className = "film-card";
    card.innerHTML = `
      <img src="${data.Poster}" />
      <h3>${data.Title}</h3>
      <p>${data.Year}</p>
    `;
    card.onclick = () => openPlayer(film.screenpal, data);
    grid.appendChild(card);
  });
}

// Open ScreenPal video
function openPlayer(screenpalID, info) {
  const modal = document.getElementById("playerModal");
  const container = document.getElementById("playerContainer");
  const filmInfo = document.getElementById("filmInfo");

  container.innerHTML = `
    <iframe width="100%" height="500px" style="border:0;" 
      src="https://go.screenpal.com/player/${screenpalID}?width=100%&height=100%&ff=1&title=0" allowfullscreen></iframe>
  `;

  filmInfo.innerHTML = `
    <h2>${info.Title}</h2>
    <p><strong>Year:</strong> ${info.Year}</p>
    <p><strong>Genre:</strong> ${info.Genre}</p>
    <p><strong>Plot:</strong> ${info.Plot}</p>
  `;

  modal.style.display = "flex";
}

// Event listeners
document.getElementById("closeBtn").onclick = () => {
  document.getElementById("playerModal").style.display = "none";
};
document.getElementById("searchBar").oninput = renderFilms;
document.getElementById("categorySelect").onchange = renderFilms;

// Initialize site
(async () => {
  await preloadFilms();
  buildCategories();
  renderFilms();
})();
</script>

</body>
</html>
